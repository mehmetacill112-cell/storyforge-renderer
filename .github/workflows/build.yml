name: build-and-push-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel queued/in-progress runs on the same branch when a new commit lands:
# only the latest main commit's image is deployed anyway, so older runs are
# wasted CI minutes. Per-branch group ensures PRs (different ref) aren't
# stomped by main pushes.
concurrency:
  group: build-and-push-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNPOD_TEMPLATE_ID: rhawjehr4p
  RUNPOD_ENDPOINT_ID: dol92sassmp4c0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Disk hygiene (free runner space for big CUDA image)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache
          docker system prune -af
          df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "image_tag=ghcr.io/${{ github.repository_owner }}/storyforge-renderer:${{ github.sha }}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/storyforge-renderer:latest
            ghcr.io/${{ github.repository_owner }}/storyforge-renderer:${{ github.sha }}
          # Registry-only cache: GHA cache backend can leave orphan refs when
          # concurrency cancels mid-build (404 BlobNotFound). Registry cache via
          # a dedicated :buildcache tag is concurrency-safe (each push writes the
          # full manifest atomically) and persists across runs.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/storyforge-renderer:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/storyforge-renderer:buildcache,mode=max,image-manifest=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only auto-deploy when build came from a push to main (not workflow_dispatch
    # tests). Skip if commit message contains "[skip deploy]" for emergency holds.
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]')
    steps:
      - name: Patch RunPod template + bump IMAGE_REFRESH
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          NOW=$(date +%s)
          PAYLOAD=$(jq -c -n \
            --arg img "$IMAGE_TAG" \
            --arg now "$NOW" \
            --arg hf "$HF_TOKEN" \
            '{
              imageName: $img,
              env: {
                HF_HOME: "/runpod-volume/hf-cache",
                HF_HUB_CACHE: "/runpod-volume/hf-cache/hub",
                HF_XET_CACHE: "/runpod-volume/hf-cache/xet",
                HF_ASSETS_CACHE: "/runpod-volume/hf-cache/assets",
                HF_HUB_DISABLE_XET: "1",
                HF_HUB_OFFLINE: "0",
                TRANSFORMERS_OFFLINE: "0",
                HF_DATASETS_OFFLINE: "0",
                HF_TOKEN: $hf,
                TMPDIR: "/runpod-volume/tmp",
                IMAGE_REFRESH: $now,
                LOG_LEVEL: "INFO",
                PYTHONUNBUFFERED: "1"
              }
            }')
          echo "PATCH template ${{ env.RUNPOD_TEMPLATE_ID }} → $IMAGE_TAG"
          curl -fsSL -X PATCH \
            "https://rest.runpod.io/v1/templates/${{ env.RUNPOD_TEMPLATE_ID }}" \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" | jq '{imageName, env: (.env | {IMAGE_REFRESH, HF_XET_CACHE})}'

      - name: Force-drain warm workers (sync everyone to latest image)
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          # Warm workers DON'T auto-rotate when template imageName changes —
          # they keep serving requests with their cached image until they idle
          # out. Result: mixed-version cluster (audit 2026-05-26: latest27 +
          # latest29 workers serving in parallel after a deploy).
          # Fix: PATCH workersMax=0 to drain, wait, then bump back to 3.
          gql() {
            curl -fsSL -X POST -H "Authorization: Bearer $RUNPOD_API_KEY" \
              -H "Content-Type: application/json" \
              "https://api.runpod.io/graphql" -d "$1" | jq -r '.data // .errors'
          }
          DRAIN='{"query":"mutation { saveEndpoint(input: { id: \"dol92sassmp4c0\", name: \"storyforge-renderer\", templateId: \"rhawjehr4p\", networkVolumeId: \"z0jl8dbtgo\", gpuIds: \"AMPERE_80,ADA_48_PRO,AMPERE_48,-NVIDIA A40\", workersMin: 0, workersMax: 0, idleTimeout: 5, scalerType: \"QUEUE_DELAY\", scalerValue: 4, flashBootType: OFF }) { id workersMax } }"}'
          RESTORE='{"query":"mutation { saveEndpoint(input: { id: \"dol92sassmp4c0\", name: \"storyforge-renderer\", templateId: \"rhawjehr4p\", networkVolumeId: \"z0jl8dbtgo\", gpuIds: \"AMPERE_80,ADA_48_PRO,AMPERE_48,-NVIDIA A40\", workersMin: 0, workersMax: 3, idleTimeout: 30, scalerType: \"QUEUE_DELAY\", scalerValue: 4, flashBootType: OFF }) { id workersMax } }"}'
          echo "drain → workersMax=0"; gql "$DRAIN"
          # Wait up to 90s for active jobs to finish + workers to die.
          for i in 1 2 3 4 5 6 7 8 9; do
            sleep 10
            T=$(curl -fsSL -H "Authorization: Bearer $RUNPOD_API_KEY" \
              "https://api.runpod.ai/v2/${{ env.RUNPOD_ENDPOINT_ID }}/health" \
              | jq -r '.workers | (.idle + .initializing + .ready + .running + .throttled + .unhealthy)')
            echo "[${i}0s] workers=$T"
            [ "$T" = "0" ] && break
          done
          echo "restore → workersMax=3"; gql "$RESTORE"

      - name: Smoke ping (validate fresh worker boots new image)
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          # Fire async ping, surface job ID for tracking; do not block deploy on
          # GPU availability (EU-RO-1 can throttle and we don't want a 20min CI).
          JOB=$(curl -fsSL -X POST \
            "https://api.runpod.ai/v2/${{ env.RUNPOD_ENDPOINT_ID }}/run" \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"input":{"op":"ping"}}' | jq -r .id)
          echo "smoke ping job: $JOB"
          echo "::notice title=Smoke job submitted::$JOB (poll /v2/${{ env.RUNPOD_ENDPOINT_ID }}/status/$JOB)"
